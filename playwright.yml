name: Playwright Tests
on:
  push:
    paths: ['01-playwright-ecommerce/**', '.github/workflows/playwright.yml']
  pull_request:
    paths: ['01-playwright-ecommerce/**', '.github/workflows/playwright.yml']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 01-playwright-ecommerce
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps
      - run: npm run typecheck
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: 01-playwright-ecommerce/playwright-report/
