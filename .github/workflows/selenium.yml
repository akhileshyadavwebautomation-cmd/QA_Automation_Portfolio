name: Selenium Tests
on:
  push:
    paths: ['02-selenium-web-ui/**', '.github/workflows/selenium.yml']
  pull_request:
    paths: ['02-selenium-web-ui/**', '.github/workflows/selenium.yml']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 02-selenium-web-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B clean test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selenium-report
          path: 02-selenium-web-ui/test-output/
