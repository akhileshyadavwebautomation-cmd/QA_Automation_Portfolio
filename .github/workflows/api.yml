name: API Tests
on:
  push:
    paths: ['03-api-automation/**', '.github/workflows/api.yml']
  pull_request:
    paths: ['03-api-automation/**', '.github/workflows/api.yml']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 03-api-automation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B clean test
