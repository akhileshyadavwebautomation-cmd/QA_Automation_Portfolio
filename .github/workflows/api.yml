
name: API Tests

on:
  push:
    paths:
      - '03-api-automation/**'
      - '.github/workflows/api.yml'

  pull_request:
    paths:
      - '03-api-automation/**'
      - '.github/workflows/api.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run API Automation Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: 03-api-automation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Maven tests
        run: mvn -B clean test
        
      - name: Generate TestNG HTML Report
        if: always()
        run: mvn surefire-report:report

      - name: Upload API Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: |
            03-api-automation/target/surefire-reports/
            03-api-automation/target/site/surefire-report.html
          if-no-files-found: warn
          retention-days: 14

